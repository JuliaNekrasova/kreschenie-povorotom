<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
:root { --bg:#080c10; --surface:#10161c; --surface-2:#151d25; --line:#26333d; --text:#edf2f4; --muted:#91a0aa; --orange:#f47a21; }
body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 1.02rem; line-height: 1.6; color: var(--text); background: var(--bg); }
h1 { font-size: 1.6rem; line-height: 1.3; margin-bottom: .5rem; }
h2 { font-size: 1.3rem; margin-top: 2.2rem; border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
h4 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
a { color: var(--orange); }
blockquote { margin: 1rem 0; padding: .8rem 1.2rem; background: var(--surface); border-left: 4px solid var(--orange); font-style: normal; }
blockquote p { margin: .45rem 0; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92rem; }
th, td { border: 1px solid var(--line); padding: .4rem .55rem; vertical-align: top; text-align: left; }
th { background: var(--surface-2); }
details { margin: 1rem 0; border: 1px solid var(--line); border-radius: 6px; padding: 0 1rem; background: var(--surface); }
details[open] { padding-bottom: .8rem; }
summary { cursor: pointer; font-weight: bold; padding: .7rem 0; color: var(--orange); }
.ryad { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.2rem 0; }
.ryad figure { flex: 1 1 14rem; margin: 0; }
figure img { width: 100%; height: auto; display: block; border-radius: 4px; }
figcaption { font-size: .85rem; color: var(--muted); margin-top: .35rem; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0 1rem; }
@media print { details { border: 0; padding: 0; } summary { list-style: none; } }
</style>
</head>
<body>
$body$
<script>
window.addEventListener('beforeprint', function () { document.querySelectorAll('details').forEach(function (d) { d.open = true; }); });
</script>
</body>
</html>
